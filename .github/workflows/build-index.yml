name: Build recipe index
on:
  push:
    paths:
      - "data/*.json"
    branches: [main]
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate data/index.json
        run: |
          cd data
          ls *.json | grep -v '^index.json$' | sort | jq -R . | jq -s . > index.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/index.json
          git diff --cached --quiet || (git commit -m "Update recipe index" && git push)
