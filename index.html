<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our recipes</title>
<style>
:root{--bg:#fafaf8;--fg:#1f2421;--mute:#7a817c;--line:#dcdfda;--acc:#2f6f4f;--soft:#eef1ed;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171a18;--fg:#e8ebe7;--mute:#8f9892;--line:#2f3531;--acc:#6fc096;--soft:#212622;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:1.5rem 1rem 4rem}
h1{font:600 1.7rem/1.2 Georgia,serif;margin:0 0 1.2rem}
.filters{display:grid;grid-template-columns:1fr 1fr 1.5fr 1.2fr;gap:1rem;align-items:start}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.side{grid-column:1/-1}}
@media (max-width:480px){.filters{grid-template-columns:1fr}}
.col h2{font-size:.9rem;font-weight:600;margin:0 0 .3rem}
.list{height:11rem;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:.3rem .5rem}
.list label{display:block;padding:.1rem 0;cursor:pointer}
.nl{color:var(--mute)}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=url],select,textarea{width:100%;padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
button{padding:.4rem .8rem;border:1px solid var(--line);border-radius:6px;background:var(--soft);cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--bg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.side button{margin-top:.6rem;width:100%}
#add{margin-top:1.2rem;padding:1rem;border:1px solid var(--line);border-radius:6px}
#add[hidden]{display:none}
#add label{display:block;margin:.6rem 0 .2rem;font-size:.9rem;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.row{display:grid;grid-template-columns:1.3fr 1.3fr .8fr 1fr .9fr auto;gap:.4rem;margin-bottom:.4rem}
@media (max-width:760px){.row{grid-template-columns:1fr 1fr}}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
#msg{color:var(--mute);margin:.5rem 0 0;font-size:.9rem}
pre{max-height:12rem;overflow:auto;background:var(--soft);padding:.6rem;border-radius:6px;font-size:.8rem}
.bar{display:flex;justify-content:space-between;margin:1.5rem 0 .5rem;color:var(--mute);font-size:.9rem}
.bar a{color:var(--acc);cursor:pointer}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{display:grid;grid-template-columns:6.5rem 1fr;gap:.2rem .8rem;padding:.7rem 0;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.date{color:var(--mute);font-variant-numeric:tabular-nums}
.title{font:600 1.1rem Georgia,serif}
.base{color:var(--acc);font-size:.85rem;margin-left:.5rem;font-family:system-ui,sans-serif;font-weight:400}
.tags{grid-column:2;display:flex;flex-wrap:wrap;gap:.3rem}
.tag{font-size:.8rem;padding:0 .5rem;border-radius:99px;background:var(--soft);color:var(--mute)}
.body{padding:0 0 1.2rem 7.3rem}
@media (max-width:600px){.body{padding-left:0}summary{grid-template-columns:1fr}.tags{grid-column:1}}
.body h4{margin:.8rem 0 .2rem;font-size:.9rem}
.body ul{margin:0;padding-left:1.1rem}
.body p{margin:.3rem 0;white-space:pre-wrap;max-width:70ch}
.note{color:var(--mute)}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>Our recipes</h1>

<section class="filters">
  <div class="col"><h2>Base</h2><div class="list" data-k="base"></div></div>
  <div class="col"><h2>Meat</h2><div class="list" data-k="meat"></div></div>
  <div class="col"><h2>Vegetables</h2><div class="list" data-k="veg"></div></div>
  <div class="col side">
    <h2>Search</h2>
    <input type="text" id="q" placeholder="Title, ingredient, note…" aria-label="Search recipes">
    <button id="toggle" aria-expanded="false">Add recipe</button>
  </div>
</section>

<section id="add" hidden>
  <div class="two">
    <div><label for="f-date">Date cooked</label><input type="date" id="f-date"></div>
    <div><label for="f-base">Base</label><select id="f-base"><option>rice</option><option>pasta</option><option>potatoes</option><option>other</option></select></div>
  </div>
  <label for="f-title">Title</label><input type="text" id="f-title">
  <label>Ingredients</label>
  <div id="rows"></div>
  <button type="button" id="addrow">Add ingredient</button>
  <label for="f-recipe">Recipe</label><textarea id="f-recipe" rows="5"></textarea>
  <label for="f-url">Recipe link (optional)</label><input type="url" id="f-url">
  <label for="f-notes">Notes</label><textarea id="f-notes" rows="2"></textarea>
  <div class="actions">
    <button class="primary" id="gh">Open on GitHub</button>
    <button id="copy">Copy JSON</button>
    <button id="dl">Download file</button>
  </div>
  <p id="msg"></p>
  <pre id="out" hidden></pre>
</section>

<div class="bar"><span id="count">Loading…</span><a id="clear" hidden>Clear filters</a></div>
<div id="results"></div>
</main>

<script>
// Set these to your own GitHub details.
const CONFIG = { owner: "WutiGeronimo", repo: "recipes", branch: "main" };

const GROUPS = [["base","Base"],["meat","Meat"],["vegetables","Vegetables"],["other","Other"]];
const BASES = ["rice","pasta","potatoes","other"];
const NONE = "__none__";
let recipes = [], q = "";
const sel = { base:new Set(), meat:new Set(), veg:new Set() };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = i => (i.name || "").trim().toLowerCase();
const ings = (r, g) => (r.ingredients || []).filter(i => (i.group || "other") === g);
const label = i => esc(i.name) + (i.name_nl ? ` <span class="nl">${esc(i.name_nl)}</span>` : "");

async function load() {
  try {
    const files = await (await fetch("data/index.json", { cache: "no-store" })).json();
    const all = await Promise.all(files.map(async f => {
      try { const r = await (await fetch("data/" + f, { cache: "no-store" })).json(); r.date = f.replace(".json",""); return r; }
      catch { return null; }
    }));
    recipes = all.filter(Boolean).sort((a,b) => b.date.localeCompare(a.date));
  } catch {
    $("#count").textContent = "Couldn’t load data/index.json. Open the page over http, not as a local file.";
    return;
  }
  buildFilters(); render();
}

function options(group) {
  const m = new Map();
  recipes.forEach(r => ings(r, group).forEach(i => { const k = key(i); if (k && !m.has(k)) m.set(k, i); }));
  return [...m].sort((a,b) => a[0].localeCompare(b[0])).map(([k,i]) => [k, label(i)]);
}
function fill(k, items) {
  $(`.list[data-k=${k}]`).innerHTML = [["", "All"], ...items]
    .map(([v,l]) => `<label><input type="checkbox" data-v="${esc(v)}"> ${l}</label>`).join("");
}
function buildFilters() {
  fill("base", BASES.map(b => [b, b]));
  fill("meat", [[NONE, "None"], ...options("meat")]);
  fill("veg", options("vegetables"));
  sync();
}
function sync() {
  document.querySelectorAll(".list").forEach(el => {
    const set = sel[el.dataset.k];
    el.querySelectorAll("input").forEach(c => { const v = c.dataset.v; c.checked = v === "" ? set.size === 0 : set.has(v); });
  });
}
document.querySelectorAll(".list").forEach(el => el.addEventListener("change", e => {
  const set = sel[el.dataset.k], v = e.target.dataset.v;
  if (v === "") set.clear(); else e.target.checked ? set.add(v) : set.delete(v);
  sync(); render();
}));
$("#q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); render(); });
$("#clear").addEventListener("click", () => {
  Object.values(sel).forEach(s => s.clear()); q = ""; $("#q").value = ""; sync(); render();
});

function match(r) {
  if (sel.base.size && !sel.base.has(r.base)) return false;
  if (sel.meat.size) {
    const m = ings(r, "meat").map(key);
    if (![...sel.meat].some(v => v === NONE ? m.length === 0 : m.includes(v))) return false;
  }
  if (sel.veg.size) {
    const v = ings(r, "vegetables").map(key);
    if (![...sel.veg].some(x => v.includes(x))) return false;
  }
  if (q) {
    const hay = [r.title, r.recipe, r.notes, ...(r.ingredients || []).flatMap(i => [i.name, i.name_nl, i.notes])].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function card(r) {
  const tags = [...ings(r,"meat"), ...ings(r,"vegetables")].map(i => `<span class="tag">${esc(i.name)}</span>`).join("");
  const list = GROUPS.map(([g, name]) => {
    const l = ings(r, g);
    return l.length ? `<h4>${name}</h4><ul>${l.map(i => `<li>${i.quantity ? `<b>${esc(i.quantity)}</b> ` : ""}${label(i)}${i.notes ? ` <span class="note">(${esc(i.notes)})</span>` : ""}</li>`).join("")}</ul>` : "";
  }).join("");
  const url = /^https?:\/\//.test(r.recipe_url || "") ? `<p><a href="${esc(r.recipe_url)}" target="_blank" rel="noopener">Original recipe</a></p>` : "";
  return `<details><summary><span class="date">${esc(r.date)}</span><span><span class="title">${esc(r.title)}</span><span class="base">${esc(r.base)}</span></span><span class="tags">${tags}</span></summary>
  <div class="body">${list}${r.recipe ? `<h4>Recipe</h4><p>${esc(r.recipe)}</p>` : ""}${url}${r.notes ? `<h4>Notes</h4><p>${esc(r.notes)}</p>` : ""}</div></details>`;
}

function render() {
  const shown = recipes.filter(match);
  $("#count").textContent = `${shown.length} of ${recipes.length} recipes`;
  $("#clear").hidden = !(q || sel.base.size || sel.meat.size || sel.veg.size);
  $("#results").innerHTML = shown.length ? shown.map(card).join("") : `<p class="note">No recipes match these filters. Clear a filter to see more.</p>`;
}

/* ---------- Add recipe form ---------- */
$("#toggle").addEventListener("click", () => {
  const p = $("#add"), open = p.hidden;
  p.hidden = !open; $("#toggle").setAttribute("aria-expanded", open);
  if (open && !$("#rows").children.length) { for (let i = 0; i < 4; i++) addRow(); }
  if (open && !$("#f-date").value) $("#f-date").valueAsDate = new Date();
});
function addRow() {
  const d = document.createElement("div"); d.className = "row";
  d.innerHTML = `<input type="text" class="n" placeholder="Name" aria-label="Name">
    <input type="text" class="nl" placeholder="Nederlands" aria-label="Dutch name">
    <input type="text" class="q" placeholder="Quantity" aria-label="Quantity">
    <input type="text" class="no" placeholder="Notes" aria-label="Notes">
    <select class="g" aria-label="Group"><option value="base">base</option><option value="meat">meat</option><option value="vegetables">vegetables</option><option value="other" selected>other</option></select>
    <button type="button" aria-label="Remove ingredient">×</button>`;
  d.querySelector("button").onclick = () => d.remove();
  $("#rows").appendChild(d);
}
$("#addrow").addEventListener("click", addRow);

function build() {
  const date = $("#f-date").value, title = $("#f-title").value.trim();
  if (!date || !title) { $("#msg").textContent = "Add a date and a title first."; return null; }
  const ingredients = [...document.querySelectorAll("#rows .row")].map(r => {
    const g = c => r.querySelector(c).value.trim();
    return { name: g(".n"), name_nl: g(".nl"), quantity: g(".q"), notes: g(".no"), group: g(".g") };
  }).filter(i => i.name);
  const json = JSON.stringify({ title, base: $("#f-base").value, recipe: $("#f-recipe").value.trim(),
    recipe_url: $("#f-url").value.trim(), ingredients, notes: $("#f-notes").value.trim() }, null, 2) + "\n";
  $("#out").hidden = false; $("#out").textContent = json; $("#msg").textContent = "";
  return { name: date + ".json", json };
}
$("#gh").addEventListener("click", () => {
  const b = build(); if (!b) return;
  const { owner, repo, branch } = CONFIG;
  window.open(`https://github.com/${owner}/${repo}/new/${branch}/data?filename=${encodeURIComponent(b.name)}&value=${encodeURIComponent(b.json)}`, "_blank");
  $("#msg").textContent = "GitHub opened in a new tab. Click “Commit changes” there to save the recipe.";
});
$("#copy").addEventListener("click", async () => {
  const b = build(); if (!b) return;
  try { await navigator.clipboard.writeText(b.json); $("#msg").textContent = `Copied. Save it as data/${b.name}.`; }
  catch { $("#msg").textContent = "Couldn’t copy. Select the text below and copy it by hand."; }
});
$("#dl").addEventListener("click", () => {
  const b = build(); if (!b) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([b.json], { type: "application/json" }));
  a.download = b.name; a.click(); URL.revokeObjectURL(a.href);
  $("#msg").textContent = `Downloaded ${b.name}. Upload it to the data folder in your repo.`;
});

load();
</script>
</body>
</html>
